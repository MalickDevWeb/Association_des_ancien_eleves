<!-- Hero Section Spectaculaire -->
<div class="relative pt-32 pb-40 lg:pt-40 lg:pb-48 overflow-hidden flex items-center min-h-[50vh] bg-primary" style="clip-path: ellipse(180% 100% at 50% 0%);">
  <!-- Background Parallax -->
  <div class="absolute inset-0 bg-[url('/assets/images/ecole-entree.png')] bg-cover bg-center bg-fixed scale-105 opacity-30 mix-blend-overlay"></div>
  <!-- Overlay Gradient Premium -->
  <div class="absolute inset-0 bg-gradient-to-b from-primary via-primary/80 to-primary/95"></div>
  
  <div class="container-custom relative z-10 w-full pb-8 text-center">
    <div class="max-w-3xl mx-auto">
      <div class="inline-flex items-center gap-2 mb-6 px-5 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
        <span class="text-white font-bold tracking-[0.1em] uppercase text-xs md:text-sm">Notre Réseau</span>
      </div>
      
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-white mb-6 leading-tight drop-shadow-2xl">
        Nos <span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-white">Membres</span>
      </h1>
      
      <p class="text-xl md:text-2xl text-white/80 font-light max-w-2xl mx-auto leading-relaxed">
        La force de notre réseau réside dans la diversité, l'expertise et l'engagement indéfectible de chacun de nos membres.
      </p>
    </div>
  </div>
</div>

<!-- Section Annuaire des Membres -->
<div class="py-24 bg-[#F8F7FC] relative">
  <!-- Décorations lumineuses -->
  <div class="absolute top-20 right-20 w-96 h-96 bg-accent/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-20 left-10 w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>

  <div class="container-custom relative z-10">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-10 lg:gap-y-0">
      @for (member of members(); track member.id; let i = $index) {
        
        <!-- Carte Membre Premium -->
        <div class="bg-white rounded-[2rem] p-8 shadow-md hover:shadow-2xl transition-all duration-500 group border border-borderLight flex flex-col items-center text-center transform hover:-translate-y-2 relative overflow-hidden"
             [class.lg:mt-8]="i % 4 === 1" [class.lg:mt-16]="i % 4 === 2" [class.lg:mt-24]="i % 4 === 3">
          
          <!-- Lueur d'arrière-plan au hover -->
          <div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

          <!-- Avatar avec bordure animée -->
          <div class="relative w-28 h-28 mb-6 group-hover:scale-110 transition-transform duration-500">
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-accent/40 group-hover:rotate-180 transition-transform duration-1000"></div>
            <img [src]="member.image" [alt]="member.name" class="w-full h-full object-cover rounded-full p-2 relative z-10 bg-white">
            
            <!-- Pastille de disponibilité (déco) -->
            <div class="absolute bottom-2 right-2 w-4 h-4 bg-green-500 rounded-full border-2 border-white shadow-sm z-20"></div>
          </div>
          
          <!-- Informations -->
          <div class="relative z-10 flex-grow flex flex-col">
            <h3 class="text-xl font-bold text-primary mb-1 group-hover:text-accent transition-colors">{{ member.name }}</h3>
            <p class="text-sm text-accent font-extrabold uppercase tracking-wider mb-4">{{ member.profession }}</p>
            
            <div class="inline-flex items-center justify-center gap-1.5 bg-secondary px-4 py-1.5 rounded-full text-xs text-primary font-bold mb-5 mx-auto w-fit shadow-sm">
              <svg class="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              {{ member.city }}
            </div>
            
            <p class="text-sm text-textSecondary font-light leading-relaxed flex-grow">{{ member.bio }}</p>
          </div>
          
          <!-- Trait décoratif bas -->
          <div class="w-12 h-1 bg-gradient-to-r from-transparent via-accent/50 to-transparent mt-8 rounded-full group-hover:w-full group-hover:via-accent transition-all duration-500"></div>
        </div>
      }
    </div>
  </div>
</div>
