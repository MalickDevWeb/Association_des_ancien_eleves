<!-- Hero Section Spectaculaire -->
<div class="relative pt-32 pb-40 lg:pt-40 lg:pb-48 overflow-hidden flex items-center min-h-[50vh] bg-primary" style="clip-path: ellipse(180% 100% at 50% 0%);">
  <!-- Background Parallax -->
  <div class="absolute inset-0 bg-[url('/assets/images/ecole-cour.png')] bg-cover bg-center bg-fixed scale-105 opacity-40 mix-blend-overlay"></div>
  <!-- Overlay Gradient Premium -->
  <div class="absolute inset-0 bg-gradient-to-b from-primary via-primary/80 to-primary/95"></div>
  
  <div class="container-custom relative z-10 w-full pb-8 text-center">
    <div class="max-w-3xl mx-auto">
      <div class="inline-flex items-center gap-2 mb-6 px-5 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
        <span class="text-white font-bold tracking-[0.1em] uppercase text-xs md:text-sm">Bureau Exécutif</span>
      </div>
      
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-white mb-6 leading-tight drop-shadow-2xl">
        Notre <span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-white">Organisation</span>
      </h1>
      
      <p class="text-xl md:text-2xl text-white/80 font-light max-w-2xl mx-auto leading-relaxed">
        Découvrez l'équipe dirigeante qui veille au bon fonctionnement et au développement continu de notre association.
      </p>
    </div>
  </div>
</div>

<!-- Section Équipe Dirigeante -->
<div class="py-24 bg-[#F8F7FC] relative">
  <!-- Décoration fond -->
  <div class="absolute top-40 right-0 w-96 h-96 bg-accent/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-20 left-0 w-72 h-72 bg-primary/5 rounded-full blur-3xl"></div>

  <div class="container-custom relative z-10">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-24 mt-12">
      @for (member of bureauMembers(); track member.id; let i = $index) {
        <div class="bg-white rounded-[2rem] p-8 shadow-xl hover:shadow-2xl transition-all duration-500 group border border-white hover:border-accent/30 text-center relative"
             [class.lg:mt-8]="i === 1" [class.lg:mt-16]="i === 2" [class.lg:mt-24]="i === 3">
          
          <!-- Avatar Flottant -->
          <div class="absolute -top-16 left-1/2 transform -translate-x-1/2">
            <div class="relative w-32 h-32">
              <div class="absolute inset-0 bg-accent rounded-full blur-md opacity-30 group-hover:opacity-70 group-hover:scale-110 transition-all duration-500"></div>
              <img [src]="member.image" [alt]="member.name" class="relative w-full h-full rounded-full object-cover border-4 border-white shadow-lg group-hover:scale-105 transition-transform duration-500 z-10">
              
              <!-- Petit badge décoratif -->
              <div class="absolute bottom-0 right-0 w-8 h-8 bg-primary rounded-full border-2 border-white shadow-md flex items-center justify-center z-20 group-hover:bg-accent transition-colors">
                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              </div>
            </div>
          </div>
          
          <div class="pt-16 pb-4">
            <h3 class="text-2xl font-bold text-primary mb-1 group-hover:text-accent transition-colors">{{ member.name }}</h3>
            <p class="text-accent font-extrabold text-xs mb-5 uppercase tracking-[0.2em]">{{ member.role }}</p>
            <div class="w-12 h-1 bg-gradient-to-r from-accent/50 to-transparent mx-auto mb-5 rounded-full"></div>
            <p class="text-textSecondary text-sm leading-relaxed font-light">{{ member.description }}</p>
          </div>
          
          <!-- Ligne déco au fond -->
          <div class="absolute bottom-0 left-0 w-full h-1.5 bg-gradient-to-r from-transparent via-accent to-transparent transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-center rounded-b-[2rem]"></div>
        </div>
      }
    </div>
  </div>
</div>
