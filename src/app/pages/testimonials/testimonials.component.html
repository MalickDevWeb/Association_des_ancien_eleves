<div class="bg-secondary py-12">
  <div class="container-custom">
    <h1 class="text-4xl md:text-5xl font-bold text-primary text-center mb-6">Témoignages</h1>
    <p class="text-xl text-textSecondary text-center max-w-3xl mx-auto">
      Ce que nos membres disent de leur expérience au sein de l'association.
    </p>
  </div>
</div>

<div class="py-16 bg-white">
  <div class="container-custom">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (testimonial of testimonials(); track testimonial.id) {
        <div class="card p-8 relative">
          <div class="text-primary/20 absolute top-4 left-4">
            <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 32 32"><path d="M9.352 4C4.456 7.456 1 13.12 1 19.36c0 5.088 3.072 8.064 6.624 8.064 3.36 0 5.856-2.688 5.856-5.856 0-3.168-2.208-5.472-5.088-5.472-.576 0-1.344.096-1.536.192.48-3.264 3.552-7.104 6.624-9.024L9.352 4zm16.512 0c-4.8 3.456-8.256 9.12-8.256 15.36 0 5.088 3.072 8.064 6.624 8.064 3.264 0 5.856-2.688 5.856-5.856 0-3.168-2.304-5.472-5.184-5.472-.576 0-1.248.096-1.44.192.48-3.264 3.456-7.104 6.528-9.024L25.864 4z"></path></svg>
          </div>
          <p class="text-textSecondary italic relative z-10 mt-8 mb-6 text-lg">
            "{{ testimonial.text }}"
          </p>
          <div class="flex items-center gap-4 mt-auto">
            <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center text-primary font-bold text-xl">
              {{ testimonial.author.charAt(0) }}
            </div>
            <div>
              <strong class="text-primary block">{{ testimonial.author }}</strong>
              <span class="text-accent text-sm">Membre</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
